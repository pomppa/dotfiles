set -g prefix C-s
set -g mouse on
set -g default-terminal 'xterm-256color' # fix for mgc ssh

# Use Vim-style keys in copy mode and pane/window navigation.
setw -g mode-keys vi
bind -r l select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r ö select-pane -R
bind -r H previous-window
bind -r L next-window

# copy
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
set-option -g default-command "reattach-to-user-namespace -l $SHELL"

# install plugins with prefix - I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_with_mouse on

# for reloading config
bind r source-file ~/.tmux.conf #\; display-message "reloaded config!"

# arm64
set-option -g default-command "arch -arch arm64 /bin/zsh"

# init tmux plugin manager (keep this line at the very bottom of tmux.conf)
run-shell '~/dotfiles/.tmux/plugins/tpm/tpm'
